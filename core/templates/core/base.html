<!DOCTYPE html>
{%load static%}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andromeda Database</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{%static 'css/base.css'%}">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="{%url 'home'%}">IJCLab Andromeda</a>
                <div class="collapse navbar-collapse">

            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="{%url 'sample_list'%}">My Samples</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{%url 'user_list'%}">Users</a>
                </li>
            </ul>

            {%if user.is_authenticated%}
            <div class="d-flex align-items-center">
                <div class="d-flex align-items-center bg-secondary rounded-pill px-3 py-1 text-white me-3">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" class="me-2" viewBox="0 0 16 16">
                        <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>
                        <path d="M8 9c-2.67 0-5 1.34-5 3v1h10v-1c0-1.66-2.33-3-5-3z"/>
                    </svg>
                    <span>{{ user.username }}</span>
                </div>
                <form method="post" action="{%url 'logout'%}" class="m-0">
                    {%csrf_token%}
                    <button type="submit" class="btn btn-link nav-link text-white">Log Out</button>
                </form>
            </div>

            {%else%}
            
            <div class="d-flex align-items-center">
                <a class="nav-link text-white-50" href="{%url 'login'%}">Log In</a>
            </div>

            {%endif%}

        </div>
    </div>
</nav>

    <div class="container shadow-sm p-4 bg-white rounded">
        
        {%block content%}
        {%endblock content%}

    </div>

</body>
</html>
