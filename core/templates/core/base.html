<!DOCTYPE html>
{%load static%}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andromeda Database</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{%static 'css/base.css'%}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 andromeda-nav">
    <div class="container">
        <a class="navbar-brand" href="{%url 'home'%}">IJCLab Andromeda</a>
                <div class="collapse navbar-collapse">

            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link{%if request.resolver_match.url_name == 'sample_list'%} active{%endif%}" href="{%url 'sample_list'%}">My Samples</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link{%if request.resolver_match.url_name == 'user_list'%} active{%endif%}" href="{%url 'user_list'%}">Users</a>
                </li>
            </ul>

            {%if request.user.is_authenticated%}
            <div class="d-flex align-items-center">
                <div class="d-flex align-items-center user-pill rounded-pill px-3 py-1 text-white me-3">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" class="me-2" viewBox="0 0 16 16">
                        <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>
                        <path d="M8 9c-2.67 0-5 1.34-5 3v1h10v-1c0-1.66-2.33-3-5-3z"/>
                    </svg>
                    <span>{{ request.user.username }}</span>
                </div>
                <form method="post" action="{%url 'logout'%}" class="m-0">
                    {%csrf_token%}
                    <button type="submit" class="btn btn-link nav-link text-white">Log Out</button>
                </form>
            </div>

            {%else%}
            
            <div class="d-flex align-items-center">
                <a class="nav-link text-white-50" href="{%url 'login'%}">Log In</a>
            </div>

            {%endif%}

        </div>
    </div>
</nav>

    <div class="container py-4">
        {%block content%}
        {%endblock content%}

</div>

<canvas id="particle-bg"></canvas>
<script>
(function() {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var canvas = document.getElementById('particle-bg');
  var ctx = canvas.getContext('2d');
  var particles = [];
  var COUNT = 650;

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  function makeParticle() {
    var isGold = Math.random() < 0.15;
    return {
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: isGold ? (1.2 + Math.random() * 1.6) : (0.8 + Math.random() * 1.2),
      vx: (Math.random() - 0.5) * 0.5,
      vy: (Math.random() - 0.5) * 0.5,
      color: isGold ? '232, 197, 119' : '91, 141, 239',
      baseAlpha: 0.2 + Math.random() * 0.35,
      pulseSpeed: 0.01 + Math.random() * 0.02,
      pulsePhase: Math.random() * Math.PI * 2
    };
  }
  for (var i = 0; i < COUNT; i++) particles.push(makeParticle());

  function tick() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(function(p) {
      p.x += p.vx;
      p.y += p.vy;
      p.pulsePhase += p.pulseSpeed;
      if (p.x < 0) p.x = canvas.width;
      if (p.x > canvas.width) p.x = 0;
      if (p.y < 0) p.y = canvas.height;
      if (p.y > canvas.height) p.y = 0;
      var pulse = (Math.sin(p.pulsePhase) + 1) / 2;
      var alpha = p.baseAlpha + pulse * 0.35;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(' + p.color + ',' + alpha + ')';
      ctx.fill();
    });
    requestAnimationFrame(tick);
  }
  tick();
})();
</script>
</body>
</html>
